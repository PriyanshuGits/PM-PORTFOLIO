
<svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="body" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#777777"/>
      <stop offset="0.45" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b8b8b8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Pencil body -->
  <path d="M7 36 L31 12 L38 19 L14 43 L5 45 Z"
        fill="url(#body)" stroke="#555" stroke-width="1"/>

  <!-- Red grip -->
  <path d="M27 16 L33 10 L40 17 L34 23 Z"
        fill="#E53945" stroke="#ffffff" stroke-width="1"/>

  <!-- Metallic rings -->
  <path d="M30 13 L37 20 M33 10 L40 17"
        stroke="#ffffff" stroke-width="1.5"/>

  <!-- Pencil tip -->
  <path d="M7 36 L14 43 L5 45 Z"
        fill="#d6b28a" stroke="#ffffff" stroke-width="1"/>

  <!-- Graphite -->
  <path d="M5 45 L7 40 L9 43 Z" fill="#222222"/>

  <!-- Highlight -->
  <path d="M12 34 L29 17"
        stroke="#ffffff" stroke-width="1.2" opacity=".9"/>

  <!-- Red glow -->
  <circle cx="36" cy="14" r="2" fill="#E53945" filter="url(#glow)"/>
</svg>
